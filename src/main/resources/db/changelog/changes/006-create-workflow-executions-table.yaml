databaseChangeLog:
  - changeSet:
      id: 006-create-workflow-executions-table
      author: flowforge
      changes:
        - createTable:
            tableName: workflow_executions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: workflow_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_wf_exec_workflow
                    references: workflows(id)
              - column:
                  name: schedule_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_wf_exec_schedule
                    references: schedules(id)
              - column:
                  name: triggered_by
                  type: uuid
                  constraints:
                    foreignKeyName: fk_wf_exec_trigger_user
                    references: users(id)
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: trigger_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: input
                  type: jsonb
              - column:
                  name: output
                  type: jsonb
              - column:
                  name: context
                  type: jsonb
              - column:
                  name: started_at
                  type: timestamp with time zone
              - column:
                  name: completed_at
                  type: timestamp with time zone
              - column:
                  name: timeout_at
                  type: timestamp with time zone
              - column:
                  name: error_message
                  type: text
              - column:
                  name: error_stack_trace
                  type: text
              - column:
                  name: tasks_completed
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: tasks_failed
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: tasks_total
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: is_cancelled
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: cancelled_by
                  type: uuid
                  constraints:
                    foreignKeyName: fk_wf_exec_cancel_user
                    references: users(id)
              - column:
                  name: cancelled_at
                  type: timestamp with time zone
              - column:
                  name: cancellation_reason
                  type: text
              - column:
                  name: correlation_id
                  type: varchar(100)
              - column:
                  name: parent_execution_id
                  type: uuid
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0

        - createIndex:
            indexName: idx_wf_exec_workflow
            tableName: workflow_executions
            columns:
              - column:
                  name: workflow_id

        - createIndex:
            indexName: idx_wf_exec_status
            tableName: workflow_executions
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_wf_exec_started
            tableName: workflow_executions
            columns:
              - column:
                  name: started_at

        - createIndex:
            indexName: idx_wf_exec_schedule
            tableName: workflow_executions
            columns:
              - column:
                  name: schedule_id
