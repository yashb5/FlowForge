databaseChangeLog:
  - changeSet:
      id: 002-create-task-definitions-table
      author: flowforge
      changes:
        - createTable:
            tableName: task_definitions
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: task_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_def_owner
                    references: users(id)
              - column:
                  name: handler
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: http_method
                  type: varchar(10)
              - column:
                  name: default_headers
                  type: jsonb
              - column:
                  name: default_input
                  type: jsonb
              - column:
                  name: input_schema
                  type: text
              - column:
                  name: output_schema
                  type: text
              - column:
                  name: retry_strategy
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: max_retries
                  type: int
                  defaultValueNumeric: 3
                  constraints:
                    nullable: false
              - column:
                  name: retry_delay_seconds
                  type: int
                  defaultValueNumeric: 60
                  constraints:
                    nullable: false
              - column:
                  name: retry_multiplier
                  type: double
                  defaultValueNumeric: 2.0
              - column:
                  name: max_retry_delay_seconds
                  type: int
                  defaultValueNumeric: 3600
              - column:
                  name: timeout_seconds
                  type: int
                  defaultValueNumeric: 300
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: int
                  defaultValueNumeric: 5
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
              - column:
                  name: created_by
                  type: varchar(255)
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0

        - createTable:
            tableName: task_definition_tags
            columns:
              - column:
                  name: task_definition_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_def_tags
                    references: task_definitions(id)
              - column:
                  name: tag
                  type: varchar(100)
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_task_def_name
            tableName: task_definitions
            columns:
              - column:
                  name: name

        - createIndex:
            indexName: idx_task_def_owner
            tableName: task_definitions
            columns:
              - column:
                  name: owner_id

        - createIndex:
            indexName: idx_task_def_type
            tableName: task_definitions
            columns:
              - column:
                  name: task_type
